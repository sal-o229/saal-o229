<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dungeon Platformer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body { background: #050508; overflow: hidden; touch-action: none; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  #ui, #pause-btn, #controls { display: none; }
  body.playing #ui, body.playing #pause-btn, body.playing #controls { display: flex; }
  body.playing #ui { display: block; }

  #ui { position: fixed; top: 15px; left: 15px; color: #00ffff; font-size: 20px; text-shadow: 0 0 10px rgba(0,255,255,0.5); z-index: 10; font-weight: bold; }
  #ui div { margin-bottom: 5px; }
  
  #pause-btn { position: fixed; top: 15px; right: 15px; z-index: 10; width: 50px; height: 50px; background: rgba(80, 80, 80, 0.4); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; align-items: center; justify-content: center; backdrop-filter: blur(5px); cursor: pointer; }
  #pause-btn:active { background: rgba(255, 255, 255, 0.2); }
  #pause-btn::before { content: ''; display: block; width: 12px; height: 20px; border-left: 4px solid #fff; border-right: 4px solid #fff; }

  #controls { position: fixed; bottom: 25px; left: 0; width: 100%; justify-content: space-between; align-items: flex-end; padding: 0 25px; z-index: 10; }
  
  .move-group {
    display: flex;
    background: rgba(80, 80, 80, 0.4);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    backdrop-filter: blur(5px);
    overflow: hidden;
  }

  .btn { 
    width: 75px; height: 75px; 
    background: transparent; 
    color: #fff; font-size: 28px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; 
  }
  
  .btn:active { background: rgba(255, 255, 255, 0.2); }
  
  .divider {
    width: 2px;
    background: rgba(255, 255, 255, 0.2);
    margin: 15px 0;
  }

  #jump { 
    width: 90px; height: 90px; 
    background: rgba(80, 80, 80, 0.4); 
    border: 2px solid rgba(255, 255, 255, 0.2); 
    border-radius: 50%;
    color: #fff;
    backdrop-filter: blur(5px);
  }
  #jump:active { background: rgba(255, 255, 255, 0.2); }
  
  #menu { position: fixed; inset: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.3s; }
  #menu.hidden { opacity: 0; pointer-events: none; }
  #menu h1 { color: #fff; font-size: 36px; margin-bottom: 30px; text-shadow: 0 0 20px rgba(0,255,255,0.8), 0 0 40px rgba(0,0,0,0.8); letter-spacing: 2px; }
  #level-list { display: flex; flex-direction: column; align-items: center; width: 100%; }
  
  .level-btn { 
    width: 85%; max-width: 320px; 
    padding: 12px 20px; margin: 8px 0; 
    background: rgba(20, 20, 30, 0.8); 
    border: 2px solid #333; border-radius: 10px; 
    color: #ccc; font-size: 16px; text-align: left; 
    transition: all 0.2s; backdrop-filter: blur(5px);
    display: flex; flex-direction: column; gap: 5px;
  }
  .level-btn:hover, .level-btn:active { border-color: #00ffff; color: #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.3); }
  .level-btn .level-title { font-weight: bold; font-size: 18px; color: #fff; }
  .level-btn.completed { border-color: #4ecca3; }
  .level-btn .level-stats { font-size: 14px; color: #aaa; }
  .level-btn.completed .level-stats { color: #4ecca3; }
  .level-btn:hover .level-stats { color: #00ffff; }

  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #overlay h2 { color: #fff; font-size: 28px; margin-bottom: 10px; text-align: center; text-transform: uppercase; }
  #ovDesc { color: #ffd93d; font-size: 16px; margin-bottom: 25px; text-align: center; font-style: italic; max-width: 80%; }
  .ov-btns { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 300px; }
  .ov-btns button { padding: 15px 30px; background: transparent; border: 2px solid #00ffff; color: #00ffff; font-size: 18px; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  .ov-btns button:active { background: rgba(0,255,255,0.2); }
  .ov-btns button#btn-menu { border-color: #ff4d94; color: #ff4d94; }
  .ov-btns button#btn-menu:active { background: rgba(255,0,100,0.2); }
  .ov-btns button#btn-resume { border-color: #4ecca3; color: #4ecca3; display: none; }
  .ov-btns button#btn-resume:active { background: rgba(78,204,163,0.2); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div>Монеты: <span id="score">0</span></div>
  <div>Уровень: <span id="current-level-ui">1</span></div>
</div>

<div id="pause-btn"></div>

<div id="controls">
  <div class="move-group">
    <div class="btn" id="left">◀</div>
    <div class="divider"></div>
    <div class="btn" id="right">▶</div>
  </div>
  <div class="btn" id="jump">▲</div>
</div>

<div id="menu">
  <h1>ПОДЗЕМЕЛЬЕ</h1>
  <div id="level-list"></div>
</div>

<div id="overlay">
  <h2 id="ovTitle">Ты упал...</h2>
  <p id="ovDesc"></p>
  <div class="ov-btns">
    <button id="btn-resume">Продолжить</button>
    <button id="btn-restart">Заново</button>
    <button id="btn-menu">В меню</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const BG_IMAGE_URL = 'bg.jpg'; 
const bgImage = new Image();
bgImage.src = BG_IMAGE_URL;
let bgLoaded = false;
bgImage.onload = () => { bgLoaded = true; };

const GRAVITY = 0.75;      
const JUMP_POWER = -13;    
const SPEED = 5;         
const CLIMB_SPEED = 4; 
const BLOCK_SIZE = 32;
const OFFSET_Y = 100;      

const player = {
  x: 100, y: 100, w: 24, h: 36,
  vx: 0, vy: 0, onGround: false,
  facing: 1, walkTimer: 0,
  state: 'play', deathTimer: 0,
  onVine: false
};

let score = 0;
let time = 0;
let gameState = 'menu';
let currentLevelIndex = 0;
let respawnPoint = { x: 100, y: 100 };
let cam = { x: 0, y: 0 };
let funnyText = "";

const LEVELS = [
  {
    name: "Уровень 1: Начало",
    map: [
      "....................................................................................................",
      "....................................................................................................",
      ".........................................####......C................................................",
      "....................................###..#.........C................................................",
      "..................................C......#.......C.C.C..............................................",
      ".............................C..##########.........C....................E...........................",
      "..........................#######......................................###..........................",
      "....................................................................................................",
      "..........................V.........................................................................",
      "..........................V.........................................................................",
      "..........................V.........................................................................",
      ".......................C..V.........................................................................",
      "......................###.V.........................................................................",
      "....................................................................................................",
      "..............................................C.....................................................",
      "...................YY......................#######..................................................",
      "....................................................................................................",
      "...............YY.......................C...........................................................",
      ".......................................###..........................................................",
      "...........YY......^^^^^^^^^^^^^^...................................................................",
      "...........CC......##############.............XXX...................................................",
      "..........####...............................###....................................................",
      "....................................................................................................",
      "....CC..............................................................................................",
      "...####.............................................................................................",
      "....................................................................................................",
      ".P..................................................................................................",
      "##############################^^^^^^^^##############################^^^^^^^^########################"
    ]
  },
  {
    name: "Уровень 2: Подъем",
    map: [
      "....................................................................................................",
      "....................................................................................................",
      "....................................................................................................",
      "...................................................................................C................",
      "..................................................................................###...............",
      "....................................................................................................",
      "...................................................C................................................",
      "..................................................###...............................................",
      "....................................................................................................",
      "............................X.......................................................................",
      "...........................###......................................................................",
      "....................................................................................................",
      "...................C................................................................................",
      "..................###..............................................................E................",
      "..................................................................................###...............",
      "....................................................................................................",
      "............Y.......................................................................................",
      "...........###......................................................................................",
      "....................................................................................................",
      "....C...............................................................................................",
      "...###..............................................................................................",
      "....................................................................................................",
      ".P..................................................................................................",
      "############################^^^^^^^^############################^^^^^^^^############################"
    ]
  },
  {
    name: "Уровень 3: Пропасть",
    map: [
      "....................................................................................................",
      "....................................................................................................",
      "....................................................................................................",
      "....................................................................................C...............",
      "...................................................................................###..............",
      "....................................................................................................",
      ".....................................X..............................................................",
      "....................................###.............................................................",
      "....................................................................................................",
      "...........................C........................................................................",
      "..........................###.......................................................E...............",
      "..................................................................................###...............",
      "....................................................................................................",
      "...................C................................................................................",
      "..................###...............................................................................",
      "....................................................................................................",
      "............Y.......................................................................................",
      "...........###......................................................................................",
      "....................................................................................................",
      "....C...............................................................................................",
      "...###..............................................................................................",
      "....................................................................................................",
      ".P..................................................................................................",
      "########################^^^^^^^^########################^^^^^^^^########################^^^^^^^^####"
    ]
  }
];

let platforms = [];
let coins = [];
let vines = [];
let hazards = [];
let particles = [];
let exitPoint = { x: 0, y: 0, w: BLOCK_SIZE, h: BLOCK_SIZE };

// --- СИСТЕМА СОХРАНЕНИЙ ---
let progress = [];
try {
  const saved = localStorage.getItem('dungeonProgress');
  if (saved) progress = JSON.parse(saved);
} catch(e) {}

if (!progress || progress.length !== LEVELS.length) {
  progress = LEVELS.map(() => ({ maxCoins: 0, completed: false }));
}

function saveProgress() {
  try {
    localStorage.setItem('dungeonProgress', JSON.stringify(progress));
  } catch(e) {}
}

const menu = document.getElementById('menu');
const levelList = document.getElementById('level-list');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovDesc = document.getElementById('ovDesc');
const btnResume = document.getElementById('btn-resume');
const btnRestart = document.getElementById('btn-restart');
const btnMenu = document.getElementById('btn-menu');
const levelUi = document.getElementById('current-level-ui');
const pauseBtn = document.getElementById('pause-btn');

function getMaxCoins(map) {
  let count = 0;
  for (let row of map) {
    for (let char of row) {
      if (char === 'C') count++;
    }
  }
  return count;
}

function buildMenu() {
  levelList.innerHTML = '';
  LEVELS.forEach((lvl, idx) => {
    const btn = document.createElement('button');
    btn.className = 'level-btn' + (progress[idx].completed ? ' completed' : '');
    
    const maxC = getMaxCoins(lvl.map);
    const bestC = progress[idx].maxCoins;
    const status = progress[idx].completed ? 'Пройдено' : 'Не пройдено';
    
    btn.innerHTML = `
      <div class="level-title">${lvl.name}</div>
      <div class="level-stats">${bestC}/${maxC} 💎 • ${status}</div>
    `;
    
    btn.onclick = () => {
      menu.classList.add('hidden');
      currentLevelIndex = idx;
      levelUi.innerText = idx + 1;
      buildLevel();
      gameState = 'play';
      document.body.classList.add('playing');
    };
    levelList.appendChild(btn);
  });
}
buildMenu();

pauseBtn.onclick = () => {
  if (gameState === 'play') {
    gameState = 'pause';
    ovTitle.innerText = 'Пауза';
    ovDesc.innerText = '';
    btnResume.style.display = 'block';
    overlay.classList.add('show');
  }
};

btnResume.onclick = () => {
  overlay.classList.remove('show');
  gameState = 'play';
};

btnRestart.onclick = () => {
  overlay.classList.remove('show');
  buildLevel();
  gameState = 'play';
};

btnMenu.onclick = () => {
  overlay.classList.remove('show');
  buildMenu(); 
  menu.classList.remove('hidden');
  gameState = 'menu';
  document.body.classList.remove('playing'); 
};

function buildLevel() {
  platforms = [];
  coins = [];
  vines = [];
  hazards = [];
  particles = [];
  
  const map = LEVELS[currentLevelIndex].map;
  const startX = 100;
  const startY = 100;

  for (let row = 0; row < map.length; row++) {
    for (let col = 0; col < map[row].length; col++) {
      const char = map[row][col];
      const x = startX + col * BLOCK_SIZE;
      const y = startY + row * BLOCK_SIZE;

      if (char === '#') {
        platforms.push({ x, y, w: BLOCK_SIZE, h: BLOCK_SIZE, isMapBlock: true });
      } else if (char === 'P') {
        respawnPoint = { x: x, y: y - player.h };
      } else if (char === 'C') {
        coins.push({ x: x + BLOCK_SIZE/2, y: y + BLOCK_SIZE/2, r: 8, taken: false });
      } else if (char === 'E') {
        exitPoint = { x, y, w: BLOCK_SIZE, h: BLOCK_SIZE };
      } else if (char === 'V') {
        let vH = BLOCK_SIZE;
        let nextRow = row + 1;
        while (nextRow < map.length && map[nextRow][col] === 'V') {
          vH += BLOCK_SIZE;
          nextRow++;
        }
        if (!vines.find(v => v.x === x + BLOCK_SIZE/2 && v.y === y + BLOCK_SIZE)) {
          vines.push({ x: x + BLOCK_SIZE/2, y: y + BLOCK_SIZE, h: vH, w: 8 });
        }
      } else if (char === '^') {
        hazards.push({ x: x, y: y + BLOCK_SIZE - 12, w: BLOCK_SIZE, h: 12 });
      } else if (char === 'X') {
        platforms.push({ x, y, w: BLOCK_SIZE, h: BLOCK_SIZE/2, baseX: x, baseY: y, move: { axis: 'x', amp: 100, speed: 0.02 }, isMapBlock: true });
      } else if (char === 'Y') {
        platforms.push({ x, y, w: BLOCK_SIZE, h: BLOCK_SIZE/2, baseX: x, baseY: y, move: { axis: 'y', amp: 80, speed: 0.03 }, isMapBlock: true });
      }
    }
  }
  
  const mapWidth = map[0].length;
  const floorStartY = startY + map.length * BLOCK_SIZE; 
  
  const extraCols = 20;
  for (let row = 0; row < 10; row++) {
    for (let col = -extraCols; col < mapWidth + extraCols; col++) {
      platforms.push({
        x: startX + col * BLOCK_SIZE,
        y: floorStartY + row * BLOCK_SIZE,
        w: BLOCK_SIZE,
        h: BLOCK_SIZE,
        isMapBlock: true
      });
    }
  }

  player.x = respawnPoint.x; 
  player.y = respawnPoint.y;
  player.vx = 0; player.vy = 0;
  player.state = 'play';
  player.onVine = false;
  
  score = 0;
  document.getElementById('score').textContent = score;
  
  cam.x = player.x - W/2; 
  cam.y = player.y - H/2;
  btnResume.style.display = 'none';

  const funnyTexts = [
    "Даже бабушка быстрее бы справилась.",
    "Ты сломал матрицу.",
    "Уровень плакал, когда ты его проходил.",
    "Эпштейн гордится тобой... наверное.",
    "Сойдёт для сельской местности.",
    "Ты не прошел его, ты его пробежал!",
    "Поздравляю, ты потратил 5 минут жизни.",
    "Навык: умирать красиво.",
    "Это было эпично... эпично плохо.",
    "Не переживай, в следующей жизни получится.",
    "Твоя смерть была громкой, но бесполезной.",
    "Хоть попробовал, и то хлеб.",
    "Смерть — это просто еще один шаг.",
    "Ты был так близок... или нет.",
    "Следующий раз точно получится (нет).",
    "Ты умер с достоинством (нет).",
    "Ошибка 404: Навык не найден."
  ];

  funnyText = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
}

const keys = { left: false, right: false, jump: false };
function bindBtn(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; };
  const off = e => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindBtn('left', 'left'); bindBtn('right', 'right'); bindBtn('jump', 'jump');

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') { keys.jump = true; e.preventDefault(); }
  if (e.key === 'Escape' || e.key === 'p') pauseBtn.click();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') keys.jump = false;
});

function isColliding(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  if (gameState !== 'play') return;
  time++;

  if (player.state === 'dying') {
    player.deathTimer--;
    player.y += player.vy;
    player.vy += GRAVITY;
    if (player.deathTimer <= 0) {
      ovTitle.innerText = 'Ты упал...';
      const funnyTexts = [
        "Даже бабушка быстрее бы справилась.",
        "Ты сломал матрицу.",
        "Уровень плакал, когда ты его проходил.",
        "Эпштейн гордится тобой... наверное.",
        "Сойдёт для сельской местности.",
        "Ты не прошел его, ты его пробежал!",
        "Поздравляю, ты потратил 5 минут жизни.",
        "Навык: умирать красиво.",
        "Это было эпично... эпично плохо.",
        "Не переживай, в следующей жизни получится.",
        "Твоя смерть была громкой, но бесполезной.",
        "Хоть попробовал, и то хлеб.",
        "Смерть — это просто еще один шаг.",
        "Ты был так близок... или нет.",
        "Следующий раз точно получится (нет).",
        "Ты умер с достоинством (нет).",
        "Ошибка 404: Навык не найден."
      ];
      ovDesc.innerText = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
      
      btnResume.style.display = 'none';
      overlay.classList.add('show');
      player.state = 'dead';
      gameState = 'dead';
    }
    return;
  }
  if (player.state === 'dead') return;

  for (const p of platforms) {
    if (p.move) {
      const t = time * p.move.speed;
      if (p.move.axis === 'x') p.x = p.baseX + Math.sin(t) * p.move.amp;
      else p.y = p.baseY + Math.sin(t) * p.move.amp;
    }
  }

  let touchingVine = false;
  for (const v of vines) {
    const vineBox = { x: v.x - 12, y: v.y - v.h, w: 24, h: v.h };
    if (isColliding(player, vineBox)) {
      touchingVine = true;
      break;
    }
  }

  if (touchingVine && keys.jump) {
    player.onVine = true;
  } else if (!touchingVine || !keys.jump) {
    player.onVine = false;
  }

  if (player.onVine) {
    player.vy = 0;
    player.y -= CLIMB_SPEED; 
    
    if (keys.left) { player.vx = -SPEED; player.facing = -1; }
    else if (keys.right) { player.vx = SPEED; player.facing = 1; }
    else player.vx = 0;
    
  } else {
    if (keys.left) { player.vx = -SPEED; player.facing = -1; }
    else if (keys.right) { player.vx = SPEED; player.facing = 1; }
    else player.vx = 0;

    if (keys.jump && player.onGround) {
      player.vy = JUMP_POWER;
      player.onGround = false;
    }

    player.vy += GRAVITY;
    if (player.vy > 18) player.vy = 18;
  }

  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;
  for (const p of platforms) {
    if (isColliding(player, p)) {
      if (player.vy >= 0 && player.y + player.h - player.vy <= p.y + 10) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.onVine = false;
        if (p.move && p.move.axis === 'x') {
          const t = time * p.move.speed;
          const prevT = (time - 1) * p.move.speed;
          player.x += (p.baseX + Math.sin(t)*p.move.amp) - (p.baseX + Math.sin(prevT)*p.move.amp);
        }
      } else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 10) {
        player.y = p.y + p.h;
        player.vy = 0;
      } else {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  }

  if ((player.onGround || player.onVine) && (player.vx !== 0 || player.vy !== 0)) player.walkTimer += 0.25;
  else player.walkTimer = 0;

  for (const h of hazards) {
    if (isColliding(player, h)) {
      player.state = 'dying'; player.deathTimer = 60; player.vy = -8;
      player.onVine = false;
    }
  }

  // СБОР МОНЕТ И СОХРАНЕНИЕ
  for (const c of coins) {
    if (!c.taken) {
      const dx = (player.x + player.w/2) - c.x;
      const dy = (player.y + player.h/2) - c.y;
      if (Math.sqrt(dx*dx + dy*dy) < c.r + 20) {
        c.taken = true; 
        score++; 
        document.getElementById('score').textContent = score;
        
        // Сохраняем прогресс сразу при сборе!
        if (score > progress[currentLevelIndex].maxCoins) {
          progress[currentLevelIndex].maxCoins = score;
          saveProgress();
        }
      }
    }
  }

  if (isColliding(player, exitPoint)) {
    gameState = 'win';
    btnResume.style.display = 'none';
    
    progress[currentLevelIndex].completed = true;
    if (score > progress[currentLevelIndex].maxCoins) {
      progress[currentLevelIndex].maxCoins = score;
    }
    saveProgress();

    ovTitle.innerText = 'УРОВЕНЬ ПРОЙДЕН!';
    ovDesc.innerText = funnyText;

    for (let i = 0; i < 150; i++) {
      particles.push({
        x: W/2 + (Math.random() - 0.5) * 100, 
        y: H/2 + (Math.random() - 0.5) * 100,
        vx: (Math.random() - 0.5) * 20,
        vy: (Math.random() - 0.5) * 20 - 5,
        life: 1,
        color: `hsl(${Math.random() * 360}, 100%, 60%)`
      });
    }
    
    overlay.classList.add('show');
  }

  const targetCamX = player.x + player.w/2 - W/2;
  if (player.x + player.w/2 < cam.x + W/3) cam.x = targetCamX + W/6;
  else if (player.x + player.w/2 > cam.x + W*2/3) cam.x = targetCamX - W/6;
  cam.x += (targetCamX - cam.x) * 0.08;

  if (player.y < cam.y + OFFSET_Y) {
    cam.y = player.y - OFFSET_Y;
  } else if (player.y + player.h > cam.y + H - OFFSET_Y) {
    cam.y = player.y + player.h - H + OFFSET_Y;
  }
}

function drawGlow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
}

function draw() {
  if (bgLoaded) {
    const imgRatio = bgImage.width / bgImage.height;
    const screenRatio = W / H;
    let drawW, drawH, offsetX, offsetY;

    if (screenRatio > imgRatio) {
      drawW = W;
      drawH = W / imgRatio;
      offsetX = 0;
      offsetY = (H - drawH) / 2;
    } else {
      drawH = H;
      drawW = H * imgRatio;
      offsetX = (W - drawW) / 2;
      offsetY = 0;
    }
    ctx.drawImage(bgImage, offsetX, offsetY, drawW, drawH);
  } else {
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, W, H);
  }
  
  if (gameState === 'menu') {
    ctx.fillStyle = 'rgba(5, 5, 8, 0.6)'; 
    ctx.fillRect(0, 0, W, H);
    return;
  }

  ctx.fillStyle = 'rgba(5, 5, 8, 0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-Math.floor(cam.x), -Math.floor(cam.y));

  for (const p of platforms) {
    ctx.fillStyle = '#1a1414'; 
    ctx.fillRect(p.x, p.y, p.w, p.h);
    
    if (p.isMapBlock) {
      ctx.strokeStyle = '#0a0a0a'; 
      ctx.lineWidth = 2;
      const hStep = 16; 
      for (let y = p.y; y < p.y + p.h; y += hStep) {
        ctx.beginPath(); ctx.moveTo(p.x, y); ctx.lineTo(p.x + p.w, y); ctx.stroke();
        const offset = (Math.floor((y - p.y) / hStep) % 2 === 0) ? 0 : 16;
        for (let x = p.x + offset; x < p.x + p.w; x += 32) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + hStep); ctx.stroke();
        }
      }
    }
  }

  for (const h of hazards) {
    ctx.fillStyle = '#888'; 
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(h.x + i * 10.5, h.y + h.h);
      ctx.lineTo(h.x + i * 10.5 + 5.25, h.y); 
      ctx.lineTo(h.x + i * 10.5 + 10.5, h.y + h.h);
      ctx.fill();
    }
  }

  for (const v of vines) {
    ctx.strokeStyle = '#3a5a3a'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(v.x, v.y); ctx.lineTo(v.x, v.y - v.h); ctx.stroke();
    ctx.fillStyle = '#4a7a4a';
    for (let i = 0; i < v.h; i += 15) {
      ctx.beginPath(); ctx.ellipse(v.x, v.y - i, 8, 4, Math.PI/4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(v.x, v.y - i - 7, 8, 4, -Math.PI/4, 0, Math.PI*2); ctx.fill();
    }
  }

  if (exitPoint) {
    const pulse = Math.sin(time*0.1)*5;
    drawGlow(exitPoint.x + exitPoint.w/2, exitPoint.y + exitPoint.h/2, 80 + pulse, 'rgba(0,255,255,0.4)');
    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3;
    ctx.strokeRect(exitPoint.x, exitPoint.y, exitPoint.w, exitPoint.h);
  }

  for (const c of coins) {
    if (c.taken) continue;
    const bob = Math.sin(time*0.1 + c.x)*4;
    drawGlow(c.x, c.y + bob, 25, 'rgba(0,255,255,0.4)');
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.moveTo(c.x, c.y + bob - c.r); ctx.lineTo(c.x + c.r, c.y + bob);
    ctx.lineTo(c.x, c.y + bob + c.r); ctx.lineTo(c.x - c.r, c.y + bob);
    ctx.fill();
  }

  drawPlayer();

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.015;
    
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.1, 4 * p.life), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  ctx.restore();

  const vg = ctx.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function drawPlayer() {
  const px = player.x, py = player.y, w = player.w, h = player.h;
  if (player.state === 'dying') {
    const t = 1 - player.deathTimer/60;
    ctx.save();
    ctx.translate(px + w/2, py + h/2);
    ctx.rotate(t * Math.PI * 4);
    ctx.scale(1-t, 1-t); ctx.globalAlpha = 1-t;
    drawPlayerBody(-w/2, -h/2, w, h, 0, 1);
    ctx.restore();
    return;
  }
  drawPlayerBody(px, py, w, h, player.walkTimer, player.facing);
}

function drawPlayerBody(px, py, w, h, walk, facing) {
  drawGlow(px + w/2, py + h/2, w*2, 'rgba(255, 0, 100, 0.2)');
  ctx.fillStyle = '#ff0064';
  ctx.fillRect(px, py, w, h);
  ctx.fillStyle = '#ff4d94';
  ctx.fillRect(px + 4, py + 4, w - 8, h - 8);
  const eyeOffset = facing * 3;
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.arc(px + w/2 - 6 + eyeOffset, py + h/2 - 4, 4, 0, Math.PI*2);
  ctx.arc(px + w/2 + 6 + eyeOffset, py + h/2 - 4, 4, 0, Math.PI*2);
  ctx.fill();
  const legSwing = Math.sin(walk) * 5;
  ctx.fillStyle = '#99003c';
  ctx.fillRect(px + w/2 - 8, py + h - 4 + legSwing, 5, 8);
  ctx.fillRect(px + w/2 + 3, py + h - 4 - legSwing, 5, 8);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
